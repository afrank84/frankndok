<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Submit a GitHub Issue</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin-top: 1rem; }
    input, textarea { width: 100%; padding: 8px; margin-top: 0.5rem; }
    button { margin-top: 1rem; padding: 10px 15px; font-size: 16px; }
    pre { background: #f0f0f0; padding: 10px; margin-top: 1rem; }
  </style>
</head>
<body>
  <a href="/" style="text-decoration: none;">← Back to Site</a>
  <h1>📮 Submit a GitHub Issue</h1>

  <form id="issueForm">
    <label>Issue Title</label>
    <input required id="title" />

    <label>Issue Description</label>
    <textarea id="body" rows="4"></textarea>

    <label>Labels (comma-separated)</label>
    <input id="labels" />

    <label>Assignees (comma-separated)</label>
    <input id="assignees" />

    <!-- ✅ Turnstile Widget with visible checkbox -->
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAABgziybIjmMUIuVs"
         data-size="normal"
         data-theme="light">
    </div>

    <button type="submit">Submit Issue</button>
  </form>

  <pre id="response">📡 Waiting...</pre>

<script>
  document.getElementById('issueForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const responseBox = document.getElementById('response');
    responseBox.textContent = 'Submitting...';

    // Step 1: Gather form input
    const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

    const payload = {
      repo: "afrank84/feedback-board",
      title: document.getElementById('title').value.trim(),
      body: document.getElementById('body').value.trim(),
      labels: document.getElementById('labels').value.split(',').map(s => s.trim()).filter(Boolean),
      assignees: document.getElementById('assignees').value.split(',').map(s => s.trim()).filter(Boolean),
      captcha_token: captchaToken
    };

    try {
      // Step 2: Submit request and get response text (always treat as plain text first)
      const res = await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const contentType = res.headers.get("content-type") || "";
      const rawText = await res.text();

      // Step 3: Parse JSON manually, with full fallback
      let result;
      if (contentType.includes("application/json")) {
        try {
          result = JSON.parse(rawText);
        } catch (jsonErr) {
          responseBox.textContent = `❌ Server claimed JSON, but it was malformed:\n${rawText}`;
          return;
        }
      } else {
        responseBox.textContent = `❌ Server returned unexpected content-type:\n${rawText}`;
        return;
      }

      // Step 4: Handle parsed JSON
      if (res.ok) {
        responseBox.textContent = `✅ Success: ${result.html_url || "Issue created."}`;
      } else {
        responseBox.textContent = `❌ Error: ${result.error || JSON.stringify(result)}`;
      }

    } catch (networkErr) {
      responseBox.textContent = `❌ Network error: ${networkErr.message}`;
    }
  });
</script>


</body>
</html>
